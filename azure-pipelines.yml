# ═══════════════════════════════════════════════
# STAGE 4 — BUILD & PUSH DOCKER IMAGE
# ═══════════════════════════════════════════════
- stage: Build_Docker_Image
  displayName: 'Stage 4 - Build & Push Docker Image'
  dependsOn:
    - SCA
    - SAST
  jobs:
  - job: DockerBuild
    displayName: 'Build and Push Docker Image'
    steps:
    - task: Docker@2
      inputs:
        containerRegistry: '$(acrServiceConnection)'
        repository: 'nbardoloi/juice-shop'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(imageTag)
          latest
      displayName: 'Build & Push Docker Image'

    - script: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        trivy --version
      displayName: 'Install Trivy'        # ← add this in Stage 4
      
    # Trivy scan on the built image
    - script: |
        trivy image \
          --format table \
          --severity HIGH,CRITICAL \
          --exit-code 0 \
          --output $(Build.ArtifactStagingDirectory)/trivy-image-report.txt \
          $(dockerRegistry)/$(imageName):$(imageTag)
      displayName: 'Trivy - Docker Image Scan'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'Docker-Image-Scan-Report'
      displayName: 'Publish Image Scan Report'
      condition: always()

# ═══════════════════════════════════════════════
# STAGE 5 — DAST (OWASP ZAP)
# ═══════════════════════════════════════════════
- stage: DAST
  displayName: 'Stage 5 - DAST (OWASP ZAP)'
  dependsOn: Build_Docker_Image
  jobs:
  - job: ZAPScan
    displayName: 'OWASP ZAP Dynamic Scan'
    steps:
    # Step 1 - Start Juice Shop container
    - script: |
        docker pull $(dockerRegistry)/$(imageName):$(imageTag)
        docker run -d \
          --name juice-shop \
          -p 3000:3000 \
          $(dockerRegistry)/$(imageName):$(imageTag)
        echo "Waiting for app to start..."
        sleep 30
        curl -f http://localhost:3000 || (echo "App failed to start" && exit 1)
      displayName: 'Start Juice Shop Container'

    # Step 2 - Run OWASP ZAP Baseline Scan
    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/zap-reports

        docker run --rm \
          --network host \
          -v $(Build.ArtifactStagingDirectory)/zap-reports:/zap/wrk/:rw \
          ghcr.io/zaproxy/zaproxy:stable \
          zap-baseline.py \
          -t http://localhost:3000 \
          -r zap-baseline-report.html \
          -J zap-baseline-report.json \
          -x zap-baseline-report.xml \
          -I
      displayName: 'OWASP ZAP - Baseline Scan'
      continueOnError: true

    # Step 3 - Run OWASP ZAP Full Scan (optional, takes longer)
    # - script: |
    #     docker run --rm \
    #       --network host \
    #       -v $(Build.ArtifactStagingDirectory)/zap-reports:/zap/wrk/:rw \
    #       ghcr.io/zaproxy/zaproxy:stable \
    #       zap-full-scan.py \
    #       -t http://localhost:3000 \
    #       -r zap-full-report.html \
    #       -I
    #   displayName: 'OWASP ZAP - Full Scan (Optional)'
    #   continueOnError: true

    # Step 4 - Stop Juice Shop container
    - script: |
        docker stop juice-shop && docker rm juice-shop
      displayName: 'Stop Juice Shop Container'
      condition: always()

    # Step 5 - Publish ZAP Reports
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/zap-reports'
        ArtifactName: 'DAST-ZAP-Report'
      displayName: 'Publish OWASP ZAP Report'
      condition: always()

# ═══════════════════════════════════════════════
# STAGE 6 — PUBLISH ALL SECURITY REPORTS
# ═══════════════════════════════════════════════
- stage: Security_Summary
  displayName: 'Stage 6 - Security Summary'
  dependsOn:
    - SCA
    - SAST
    - DAST
  condition: always()
  jobs:
  - job: Summary
    displayName: 'Security Scan Summary'
    steps:
    - script: |
        echo "============================================"
        echo "       DevSecOps Pipeline Complete          "
        echo "============================================"
        echo "✅ SCA  - Trivy Filesystem & Image Scan"
        echo "✅ SAST - Semgrep Static Analysis"
        echo "✅ DAST - OWASP ZAP Baseline Scan"
        echo "============================================"
        echo "Check Artifacts tab for all security reports"
        echo "============================================"
      displayName: 'Print Security Summary'

trigger:
  branches:
    include:
      - master
  paths:
    exclude:
      - IAC_AppServicePlan/**    # ← exclude this folder
      - '**.md'                  # ← optionally exclude readme changes too
pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'juice-shop'
  dockerRegistry: 'docker.io/nbardoloi'       # e.g. nbardoloi.azurecr.io or docker.io/nbardoloi
  imageTag: '$(Build.BuildId)'
  acrServiceConnection: 'dockerhub-connection'  # Azure service connection name

# ═══════════════════════════════════════════════
# STAGE 1 — BUILD APPLICATION
# ═══════════════════════════════════════════════
stages:
- stage: Build_Application
  displayName: 'Stage 1 - Build Application'
  jobs:
  - job: Build
    displayName: 'Install & Build'
    steps:
    - task: UseNode@1
      inputs:
        version: '20.x'
      displayName: 'Install Node.js'

    - script: |
        npm install
      displayName: 'Install Dependencies'
      continueOnError: false

    - script: |
        npm run build --if-present
      displayName: 'Build Application'
      continueOnError: true

# ═══════════════════════════════════════════════
# STAGE 2 — SCA (Trivy - Software Composition Analysis)
# ═══════════════════════════════════════════════
- stage: SCA
  displayName: 'Stage 2 - SCA (Trivy)'
  dependsOn: Build_Application
  jobs:
  - job: TrivyScan
    displayName: 'Trivy Filesystem & Dependency Scan'
    steps:
    - script: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        trivy --version
      displayName: 'Install Trivy'

    - script: |
        trivy fs \
          --format table \
          --severity HIGH,CRITICAL \
          --exit-code 0 \
          --output $(Build.ArtifactStagingDirectory)/trivy-fs-report.txt \
          $(Build.SourcesDirectory)
      displayName: 'Trivy - Filesystem Scan (Dependencies)'

    - script: |
        trivy fs \
          --format json \
          --severity HIGH,CRITICAL \
          --exit-code 0 \
          --output $(Build.ArtifactStagingDirectory)/trivy-fs-report.json \
          $(Build.SourcesDirectory)
      displayName: 'Trivy - Filesystem Scan (JSON)'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'SCA-Trivy-Report'
      displayName: 'Publish Trivy SCA Report'
      condition: always()


trigger:
- master        # Change to 'main' if your default branch is main

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'juice-shop'

stages:

# -----------------------------
# Stage 1 - Build
# -----------------------------
- stage: Build
  displayName: 'Build Application'

  jobs:
  - job: Build
    displayName: 'Install Dependencies'

    steps:
    - checkout: self

    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        node --version
        npm --version
      displayName: 'Verify Node Installation'

    - script: |
        npm install
      displayName: 'Install npm packages'

- stage: SCA
  displayName: 'SCA - Dependency Check'
  dependsOn: Build
  jobs:
  - job: DependencyCheck
    displayName: 'OWASP Dependency Check'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: dependency-check-build-task@6
      inputs:
        projectName: 'juice-shop'
        scanPath: '$(Build.SourcesDirectory)'
        format: 'HTML'
        failOnCVSS: '7'
        enableRetired: true
      displayName: 'Run OWASP Dependency Check - HTML'

    - task: dependency-check-build-task@6
      inputs:
        projectName: 'juice-shop'
        scanPath: '$(Build.SourcesDirectory)'
        format: 'JUNIT'
        failOnCVSS: '7'
        enableRetired: true
      displayName: 'Run OWASP Dependency Check - JUNIT'

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/dependency-check-junit.xml'
      displayName: 'Publish Dependency Check Results'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Common.TestResultsDirectory)'
        ArtifactName: 'SCA-Report'
      displayName: 'Publish SCA Report'
# -----------------------------
# Stage 2 - Test
# -----------------------------
- stage: Test
  displayName: 'Run Tests'
  dependsOn: Build

  jobs:
  - job: Test
    displayName: 'Execute Tests'

    steps:
    - checkout: self

    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - script: |
        npm install
      displayName: 'Install Dependencies'

    - script: |
        npm test
      displayName: 'Run Unit Tests'
      continueOnError: true

